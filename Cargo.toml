[package]
name = "exzip"
version = "0.2.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
cap-fs-ext = "4.0.0"
cap-primitives = "4.0.0"
cap-std = "4.0.0"
chrono = "0.4.31"
clap = { version = "4.0.27", features = ["derive"] }
ctrlc = "3.2.3"
dialoguer = "0.12.0"
encoding_rs = "0.8.33"
pathdiff = "0.2.1"
tempfile = "3.4.0"
zip = { version = "7.0.0" }

[profile.release]
lto = true
